name: Build Vendora PRO EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir vendora-dist
          copy index.html vendora-dist\index.html
          xcopy css vendora-dist\css /E /I /Y
          xcopy js vendora-dist\js /E /I /Y
      - uses: actions/upload-artifact@v4
        with:
          name: Vendora-PRO
          path: vendora-dist
