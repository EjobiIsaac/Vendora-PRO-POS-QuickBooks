name: Build Vendora PRO EXE

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name Vendora-PRO --add-data "index.html;." --add-data "lock.html;." --add-data "css;css" --add-data "js;js" app.py
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vendora-PRO.exe
