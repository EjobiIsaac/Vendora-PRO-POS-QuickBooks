<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendora PRO - License Required</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center">
<div class="text-4xl">🛒</div>
<h1 class="font-black text-xl">VENDORA <span class="text-indigo-600">PRO</span></h1>
<p class="text-xs text-slate-500">POS + ACCOUNTING ENTERPRISE</p>
<p class="font-bold text-sm mt-4">Your trial period has ended.</p>
<p class="text-xs text-slate-500 mt-1">Enter your Forever License Key to continue.</p>
<input id="keyInput" placeholder="SAVVY-XXXX-XXXX-XXXX-XXXX-XXXX" class="w-full border p-3 rounded-lg mt-3 uppercase text-center text-sm">
<button onclick="activate()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mt-2">✅ ACTIVATE FOREVER</button>
<p id="msg" class="text-xs text-red-600 mt-2"></p>
<div class="bg-slate-100 p-3 rounded-xl mt-4 text-xs">
<b>Savvy Soft Technologies</b><br>Call / WhatsApp: 0770960837 / 0702788215<br>
<span class="text-slate-500">Machine ID: <b id="mid">...</b><br>Send this ID to Savvy Soft to get your key</span>
</div>
</div>
<script>
async function load(){ let s = await window.pywebview.js_api.get_status(); document.getElementById('mid').innerText = s.machine; }
async function activate(){ let k = document.getElementById('keyInput').value; let r = await window.pywebview.js_api.activate(k); if(r.ok){ alert('LICENSE ACTIVATED! Welcome to Vendora PRO'); location.reload(); } else { document.getElementById('msg').innerText = r.msg; } }
load();
</script></body></html>
