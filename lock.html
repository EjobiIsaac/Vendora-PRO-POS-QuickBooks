<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendora PRO - License Required</title>
<!-- FIX 3: Local file, works 100% offline like index.html -->
<script src="js/tailwind.js"></script>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
<div class="text-4xl">🛒</div>
<h1 class="font-black text-xl">VENDORA <span class="text-indigo-600">PRO</span></h1>
<p class="text-xs text-slate-500">POS + ACCOUNTING ENTERPRISE</p>
<p class="font-bold text-sm mt-4">Your trial period has ended.</p>
<p class="text-xs text-slate-500 mt-1">Enter your Forever License Key to continue.</p>

<input id="keyInput" placeholder="SAVVY-XXXX-XXXX-XXXX-XXXX-XXXX" class="w-full border p-3 rounded-lg mt-3 uppercase text-center text-sm outline-none focus:border-indigo-600">
<button onclick="activate()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mt-2">✅ ACTIVATE FOREVER</button>
<p id="msg" class="text-xs text-red-600 mt-2 min-h-[16px]"></p>

<div class="bg-slate-100 p-3 rounded-xl mt-4 text-xs">
<b>Savvy Soft Technologies</b><br>
Call / WhatsApp: 0770960837 / 0702788215<br>
<span class="text-slate-500">Machine ID: <b id="mid">Loading...</b><br>
Send this ID to Savvy Soft to get your key</span>
</div>

<p class="text-[10px] text-slate-400 mt-3">© Savvy Soft Technologies - All Rights Reserved</p>
</div>

<script>
async function load(){
  try {
    // FIX 2: Use .api like index.html does, NOT .js_api
    if (!window.pywebview || !window.pywebview.api) return;
    let s = await window.pywebview.api.get_status();
    if (s && s.machine) {
      document.getElementById('mid').innerText = s.machine;
    }
    // If already licensed (e.g. just activated), go straight to shop
    if (s && s.licensed) {
      window.location.href = 'index.html';
    }
  } catch(e) {
    console.error(e);
  }
}

async function activate(){
  let k = document.getElementById('keyInput').value;
  let msgEl = document.getElementById('msg');
  if (!k || k.trim().length < 10) {
    msgEl.innerText = 'Please enter your full License Key.';
    return;
  }
  msgEl.innerText = 'Checking key...';
  try {
    // FIX 2: Use .api
    let r = await window.pywebview.api.activate(k);
    if (r.ok) {
      alert('LICENSE ACTIVATED! Welcome to Vendora PRO');
      // FIX 1: Go to index.html, NOT location.reload()
      // reload() would just show lock.html again
      window.location.href = 'index.html';
    } else {
      msgEl.innerText = r.msg || 'Invalid Key. Call 0770960837';
    }
  } catch(e) {
    msgEl.innerText = 'Error. Try again or call 0770960837';
  }
}

// FIX 4: Wait for Python bridge to be ready, don't run too early
window.addEventListener('pywebviewready', load);
// Fallback if event already fired
setTimeout(load, 500);
</script>
</body>
  </html>
